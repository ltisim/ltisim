# LTISim with its own PostgreSQL.
#
#   cp backend/.env.example .env        # then edit .env
#   docker compose up -d --build
#   docker compose logs app             # shows the LMS registration link
#
# Settings come from .env in this directory. PUBLIC_URL, LTI_KEY, DB_PASSWORD
# and your AI provider settings are the ones you must fill in. DB_HOST, PORT
# and HOST in that file are ignored here: the values below take precedence.
#
# The app listens on 127.0.0.1:3001 on the host. Put a reverse proxy with
# HTTPS in front of it (see docs/Self-Hosting.md); an LMS will not launch a
# tool over plain HTTP.

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-ltisim}
      POSTGRES_USER: ${DB_USER:-ltisim}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-ltisim}
      DB_USER: ${DB_USER:-ltisim}
      PORT: "3001"
      HOST: 0.0.0.0
      NODE_ENV: production
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-3001}:3001"

volumes:
  db-data:
